services:
  flight-monitor:
    build: .
    container_name: flight-monitor
    restart: unless-stopped
    ports:
      - "9400:9400"
    volumes:
      - ./data:/app/data   # 数据持久化，重启不丢失
    environment:
      - PORT=9400
      - DB_PATH=/app/data/flights.db
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9400/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
